
<style>
.tbl{border-radius:10px;border:0.5px solid var(--border-strong);overflow:hidden;display:inline-block;}
.tbl-head{padding:7px 14px;font-size:13px;font-weight:500;}
.tbl-row{padding:4px 14px;font-size:11px;color:var(--text-secondary);border-top:0.5px solid var(--border);}
.tbl-row.pk{color:var(--text-accent);font-weight:500;}
.tbl-row.fk{color:var(--text-warning);}
.wrap{position:relative;width:100%;overflow-x:auto;}
svg.schema{display:block;}
</style>
<h2 class="sr-only">Olist e-commerce data model — tables and relationships</h2>
<div class="wrap">
<svg class="schema" width="100%" viewBox="0 0 680 660" role="img">
<title>Olist data model</title>
<desc>Nine tables connected by foreign keys showing the Olist e-commerce schema</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- ORDERS — centre -->
<g class="node c-purple" onclick="sendPrompt('What KPIs can I get from the orders table?')">
  <rect x="250" y="220" width="180" height="76" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="246" text-anchor="middle" dominant-baseline="central">orders</text>
  <text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">99,441 rows · core table</text>
  <text class="ts" x="340" y="284" text-anchor="middle" dominant-baseline="central">order_id · customer_id · status</text>
</g>

<!-- CUSTOMERS — top left -->
<g class="node c-teal" onclick="sendPrompt('What KPIs can I get from the customers table?')">
  <rect x="40" y="60" width="170" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="125" y="84" text-anchor="middle" dominant-baseline="central">customers</text>
  <text class="ts" x="125" y="104" text-anchor="middle" dominant-baseline="central">99,441 rows</text>
  <text class="ts" x="125" y="118" text-anchor="middle" dominant-baseline="central">customer_id · city · state</text>
</g>

<!-- ORDER ITEMS — right -->
<g class="node c-teal" onclick="sendPrompt('What KPIs can I get from the order items table?')">
  <rect x="470" y="220" width="175" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="557" y="244" text-anchor="middle" dominant-baseline="central">order_items</text>
  <text class="ts" x="557" y="264" text-anchor="middle" dominant-baseline="central">112,650 rows</text>
  <text class="ts" x="557" y="278" text-anchor="middle" dominant-baseline="central">order_id · product_id · price</text>
</g>

<!-- PAYMENTS — bottom left -->
<g class="node c-teal" onclick="sendPrompt('What KPIs can I get from the payments table?')">
  <rect x="40" y="380" width="175" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="127" y="404" text-anchor="middle" dominant-baseline="central">payments</text>
  <text class="ts" x="127" y="424" text-anchor="middle" dominant-baseline="central">103,886 rows</text>
  <text class="ts" x="127" y="438" text-anchor="middle" dominant-baseline="central">order_id · type · value</text>
</g>

<!-- REVIEWS — top centre -->
<g class="node c-teal" onclick="sendPrompt('What KPIs can I get from the reviews table?')">
  <rect x="250" y="60" width="175" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="337" y="84" text-anchor="middle" dominant-baseline="central">reviews</text>
  <text class="ts" x="337" y="104" text-anchor="middle" dominant-baseline="central">99,224 rows</text>
  <text class="ts" x="337" y="118" text-anchor="middle" dominant-baseline="central">order_id · score · comments</text>
</g>

<!-- PRODUCTS — far right -->
<g class="node c-amber" onclick="sendPrompt('What KPIs can I get from the products table?')">
  <rect x="470" y="380" width="175" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="557" y="404" text-anchor="middle" dominant-baseline="central">products</text>
  <text class="ts" x="557" y="424" text-anchor="middle" dominant-baseline="central">32,951 rows</text>
  <text class="ts" x="557" y="438" text-anchor="middle" dominant-baseline="central">product_id · category · weight</text>
</g>

<!-- SELLERS — bottom right -->
<g class="node c-amber" onclick="sendPrompt('What KPIs can I get from the sellers table?')">
  <rect x="470" y="500" width="175" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="557" y="524" text-anchor="middle" dominant-baseline="central">sellers</text>
  <text class="ts" x="557" y="544" text-anchor="middle" dominant-baseline="central">3,095 rows</text>
  <text class="ts" x="557" y="558" text-anchor="middle" dominant-baseline="central">seller_id · city · state</text>
</g>

<!-- GEOLOCATION — bottom centre -->
<g class="node c-gray" onclick="sendPrompt('How do I use the geolocation table for mapping?')">
  <rect x="250" y="500" width="175" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="337" y="524" text-anchor="middle" dominant-baseline="central">geolocation</text>
  <text class="ts" x="337" y="544" text-anchor="middle" dominant-baseline="central">1M rows · has duplicates</text>
  <text class="ts" x="337" y="558" text-anchor="middle" dominant-baseline="central">zip · lat · lng</text>
</g>

<!-- CATEGORY TRANSLATION — top right -->
<g class="node c-gray" onclick="sendPrompt('How do I join the category translation table?')">
  <rect x="470" y="60" width="175" height="66" rx="8" stroke-width="0.5"/>
  <text class="th" x="557" y="84" text-anchor="middle" dominant-baseline="central">category translation</text>
  <text class="ts" x="557" y="104" text-anchor="middle" dominant-baseline="central">71 rows · lookup only</text>
  <text class="ts" x="557" y="118" text-anchor="middle" dominant-baseline="central">PT name → EN name</text>
</g>

<!-- CONNECTORS -->
<!-- customers → orders -->
<path d="M210 103 L260 258" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="218" y="185" fill="var(--text-muted)">customer_id</text>

<!-- reviews → orders -->
<line x1="337" y1="126" x2="337" y2="220" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="342" y="180" fill="var(--text-muted)">order_id</text>

<!-- orders → order_items -->
<line x1="430" y1="258" x2="470" y2="258" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="434" y="250" fill="var(--text-muted)">order_id</text>

<!-- orders → payments -->
<path d="M270 296 L215 380" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="345" fill="var(--text-muted)">order_id</text>

<!-- order_items → products -->
<line x1="557" y1="286" x2="557" y2="380" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="562" y="340" fill="var(--text-muted)">product_id</text>

<!-- order_items → sellers -->
<path d="M620 286 L610 500" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

<!-- products → category translation -->
<line x1="557" y1="380" x2="557" y2="126" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- customers → geolocation -->
<path d="M125 126 L310 500" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- sellers → geolocation -->
<path d="M490 500 L425 540" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Legend -->
<line x1="40" y1="608" x2="70" y2="608" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="76" y="612" fill="var(--text-secondary)">Primary join (always used)</text>
<line x1="280" y1="608" x2="310" y2="608" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="316" y="612" fill="var(--text-secondary)">Optional join (mapping/lookup)</text>

<text class="ts" x="340" y="640" text-anchor="middle" fill="var(--text-muted)">Click any table to explore its KPIs</text>
</svg>
</div>
